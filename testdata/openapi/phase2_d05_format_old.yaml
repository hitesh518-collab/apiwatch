openapi: 3.0.3
info: { title: D-05, version: '1' }
paths:
  /users:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                count: { type: integer, format: int32 }
      responses:
        '204': { description: created }
  /events:
    get:
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  created_at: { type: string, format: date }

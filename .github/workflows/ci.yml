name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo test --workspace

  example-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: cargo build --release
      - run: python scripts/check_examples.py --binary target/release/apiwatch

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - run: cargo check --workspace --exclude apiwatch-lock-size-report

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/cache@v4
        with:
          path: .compat-cache
          key: compat-${{ runner.os }}-${{ hashFiles('compat/specs.json') }}
      - run: python -m unittest discover -s scripts/tests -p "test_fetch_compat_specs.py"
      - run: python scripts/fetch_compat_specs.py
      - run: cargo test --test compat -- --ignored --nocapture
      - run: >-
          cargo run -p apiwatch-lock-size-report --
          --manifest compat/specs.json
          --compat-dir .compat-cache
          --privacy-fixture testdata/openapi/privacy_sentinels.yaml
          --max-lock-bytes 5242880
          --json-out docs/benchmarks/phase-1-lock-size-report.json
          --markdown-out docs/benchmarks/phase-1-lock-size-report.md
          --v4-json-out docs/benchmarks/phase-2-v4-lock-size-report.json
          --v4-markdown-out docs/benchmarks/phase-2-v4-lock-size-report.md
          --check

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          openapi: testdata/openapi/verify_matching.yaml
          name: users
          lock: testdata/lock/verify_users.lock

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/cache@v4
        with:
          path: .compat-cache
          key: compat-${{ runner.os }}-${{ hashFiles('compat/specs.json') }}
      - run: python scripts/fetch_compat_specs.py
      - run: cargo build --release
      - name: Benchmark
        run: |
          python scripts/bench_perf.py
        env:
          APIWATCH_BINARY: ./target/release/apiwatch
          APIWATCH_COMPAT_DIR: .compat-cache

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/cache@v4
        with:
          path: .compat-cache
          key: compat-${{ runner.os }}-${{ hashFiles('compat/specs.json') }}
      - run: python scripts/fetch_compat_specs.py
      - run: cargo build --release
      - name: Snapshot
        run: |
          python scripts/snapshot.py
        env:
          APIWATCH_BINARY: ./target/release/apiwatch
          APIWATCH_COMPAT_DIR: .compat-cache

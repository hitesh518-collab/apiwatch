name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            ext: tar.gz
            use-cross: false
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            ext: tar.gz
            use-cross: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            ext: tar.gz
            use-cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            ext: tar.gz
            use-cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            ext: tar.gz
            use-cross: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            ext: zip
            use-cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.use-cross }}
        run: cargo install cross

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build (native)
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: ${{ matrix.use-cross }}
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: ${{ matrix.ext == 'tar.gz' }}
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../apiwatch-${{ matrix.target }}.tar.gz apiwatch

      - name: Package (windows)
        if: ${{ matrix.ext == 'zip' }}
        shell: pwsh
        run: |
          cd target\${{ matrix.target }}\release
          7z a ../../../apiwatch-${{ matrix.target }}.zip apiwatch.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apiwatch-${{ matrix.target }}
          path: apiwatch-${{ matrix.target }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten binaries
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          if [ -z "$(ls -A dist/ 2>/dev/null)" ]; then
            echo "No release artifacts found in dist/ — aborting"
            exit 1
          fi

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum * > ../SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            SHA256SUMS
          generate_release_notes: true

  container:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apiwatch-x86_64-unknown-linux-musl
          path: binary

      - name: Prepare binary
        run: |
          tar xzf binary/apiwatch-x86_64-unknown-linux-musl.tar.gz
          chmod +x apiwatch

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  cargo-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches Cargo.toml
        run: |
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAG_VER="${{ steps.version.outputs.version }}"
          if [ "$CARGO_VER" != "$TAG_VER" ]; then
            echo "Cargo.toml version ($CARGO_VER) != tag version ($TAG_VER)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Dry-run publish
        run: cargo publish --dry-run --allow-dirty

      - name: Publish to crates.io
        run: cargo publish --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  bump-packages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute source tarball SHA256
        id: sha
        run: |
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
          HASH=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"

      - name: Run bump_version.py
        run: |
          python scripts/bump_version.py \
            --version "${{ steps.version.outputs.version }}" \
            --sha256 "${{ steps.sha.outputs.sha256 }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml CHANGELOG.md Formula/apiwatch.rb Scoop/apiwatch.json
          git commit -m "chore: bump package metadata to v${{ steps.version.outputs.version }}"
          git push

  install-verify:
    needs: [release, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run install smoke tests
        run: |
          python scripts/install_smoke.py | tee install-summary.md
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Append results to release
        uses: softprops/action-gh-release@v2
        with:
          body_path: install-summary.md
